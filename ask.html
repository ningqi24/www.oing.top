<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
<style>
  /* 首屏关键样式：必须在外部 CSS 到达之前就定下背景色与 color-scheme。
     否则深色模式下浏览器会先按 color-scheme: light 画一帧白底，等 css/style.css
     到了再翻黑 —— 整屏闪一下。手机上（网络慢 + 深色模式）尤其明显。 */
  html { background: #f9f8f8; color-scheme: light; }
  html[data-theme="dark"] { background: #0f1115; color-scheme: dark; }
</style>

<link rel="stylesheet" href="css/fonts.css?v=2.17.0">
<link rel="stylesheet" href="css/style.css?v=2.17.0">
<script>
  (function () {
    try {
      var fromUrl = new URLSearchParams(location.search).get('theme');
      var saved = localStorage.getItem('oing:theme');
      var theme = fromUrl === 'light' || fromUrl === 'dark'
        ? fromUrl
        : (saved === 'light' || saved === 'dark'
          ? saved
          : (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'));
      document.documentElement.setAttribute('data-theme', theme);
      if (fromUrl === 'light' || fromUrl === 'dark') localStorage.setItem('oing:theme', theme);
    } catch (e) {}
  })();
</script>
</head>

          <svg class="i-moon" viewBox="0 0 24 24" width="17" height="17" aria-hidden="true"><path d="M20 14.5A8.5 8.5 0 0 1 9.5 4a8.5 8.5 0 1 0 10.5 10.5z"/></svg>

  <main id="main" class="chat-main">

        <p class="section-note" data-i18n="chat.note">常见问题由手写答案回答；未覆盖的会交由语言模型处理。回答可能不准确，重要事项请以邮件确认。</p>

        <p data-i18n="chat.empty">可以点下面的问题，也可以直接输入：</p>
